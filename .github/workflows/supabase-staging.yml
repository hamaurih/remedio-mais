name: Supabase Staging Migrations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate only or apply pending migrations"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: supabase-staging-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Validate and deploy staging migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"

      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show local and remote migration history
        run: supabase migration list

      - name: Preview pending migrations
        run: supabase db push --linked --dry-run

      - name: Apply pending migrations
        if: ${{ inputs.mode == 'apply' }}
        run: supabase db push --linked

      - name: Verify applied migration history
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_LATEST="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tail -1 | cut -c1-14)"
          HISTORY="$(supabase migration list)"
          printf '%s\n' "$HISTORY"
          MATCHES="$(printf '%s\n' "$HISTORY" | grep -o "$EXPECTED_LATEST" | wc -l | tr -d ' ')"
          if [ "$MATCHES" -lt 2 ]; then
            echo "Latest migration $EXPECTED_LATEST is not aligned locally/remotely." >&2
            exit 1
          fi
